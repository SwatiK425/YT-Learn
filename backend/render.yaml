services:
  - type: web
    name: praxis
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://opencode.ai/zen/v1
      - key: OPENAI_MODEL
        value: nemotron-3-ultra-free
